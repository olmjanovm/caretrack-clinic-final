<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareTrack – Kirish</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-brand" style="display: flex; align-items: center; gap: 12px; margin-bottom: 32px; justify-content: center;">
      <div class="login-brand-icon" style="width: 48px; height: 48px; background: #0f766e; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          <path d="M3 12h4l3-4 4 8 3-4h4"></path>
        </svg>
      </div>
      <div class="login-brand-text" style="display: flex; flex-direction: column; text-align: left;">
        <div style="font-size: 22px; font-weight: 700; color: #0f172a; line-height: 1.1;">CareTrack</div>
        <div style="font-size: 14px; color: #64748b;">Clinic TYBT</div>
      </div>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="login-input-wrap">
        <span class="login-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input type="text" id="username" name="username" class="login-input" placeholder="Foydalanuvchi nomi" autocomplete="username" />
      </div>

      <div class="login-input-wrap">
        <span class="login-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="password" name="password" class="login-input" placeholder="Parol" autocomplete="current-password" />
        <span class="login-input-eye" onclick="togglePassword()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
      
      <div id="loginError" class="error-box" style="display:none; width: 100%;"></div>
      <button type="submit" class="btn-login" id="submitBtn" style="background: #0f766e;">Kirish</button>
    </form>
    
    <div class="demo-accounts" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #f1f5f9; text-align: center;">
      <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Tezkor kirish (Rollar):</div>
      <div style="display: flex; gap: 6px; justify-content: center;">
        <button type="button" class="demo-btn active-demo" id="demoAdmin" data-u="admin" data-p="admin123" style="padding: 5px 14px; font-size: 12px; border-radius: 5px; border: 1.5px solid #0f766e; background: #f0fdfa; cursor: pointer; color: #0f766e; font-weight: 600;">Admin</button>
        <button type="button" class="demo-btn" id="demoDoc" data-u="m.karimova" data-p="klinik123" style="padding: 5px 14px; font-size: 12px; border-radius: 5px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; color: #475569;">Shifokor</button>
        <button type="button" class="demo-btn" id="demoRec" data-u="zulfiya" data-p="qabul123" style="padding: 5px 14px; font-size: 12px; border-radius: 5px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; color: #475569;">Qabulxona</button>
      </div>
    </div>




  </div>
</div>

<script src="/js/auth.js"></script>
<script>
  // Toggle password visibility
  function togglePassword() {
    const pwd = document.getElementById('password');
    if (pwd.type === 'password') {
      pwd.type = 'text';
    } else {
      pwd.type = 'password';
    }
  }

  // If already logged in, redirect
  (async () => {
    const u = Auth.getUser();
    if (u) { window.location.href = '/dashboard.html'; return; }
    try {
      const res = await fetch('/api/auth/me');
      if (res.ok) { Auth.setUser(await res.json()); window.location.href = '/dashboard.html'; }
    } catch {}
  })();

  // Demo fill — Admin default tanlangan
  const demoBtns = document.querySelectorAll('.demo-btn');
  function selectDemo(btn) {
    demoBtns.forEach(b => {
      b.style.border = '1px solid #e2e8f0';
      b.style.background = '#fff';
      b.style.color = '#475569';
      b.style.fontWeight = 'normal';
    });
    btn.style.border = '1.5px solid #0f766e';
    btn.style.background = '#f0fdfa';
    btn.style.color = '#0f766e';
    btn.style.fontWeight = '600';
    document.getElementById('username').value = btn.dataset.u;
    document.getElementById('password').value = btn.dataset.p;
    document.getElementById('loginError').style.display = 'none';
  }
  demoBtns.forEach(btn => btn.addEventListener('click', () => selectDemo(btn)));
  // Admin ni boshlang'ich tanlash
  selectDemo(document.getElementById('demoAdmin'));

  // Form submit
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');
    errEl.style.display = 'none';
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) { errEl.textContent = "Iltimos, barcha maydonlarni to'ldiring"; errEl.style.display = 'block'; return; }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Kirilmoqda...';
    try {
      await Auth.login(u, p);
      window.location.href = '/dashboard.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirish';
    }
  });
</script>
</body>
</html>
